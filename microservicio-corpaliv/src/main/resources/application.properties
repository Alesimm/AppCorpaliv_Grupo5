# configuracion del microservicio rest de solicitudes
spring.application.name=microservicio-corpaliv
server.port=8080

# base de datos h2 guardada en archivo para conservar datos al reiniciar
spring.datasource.url=jdbc:h2:file:./data/corpalivdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# crea y actualiza las tablas automaticamente segun las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# consola web h2 disponible en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
